<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F6F8FF">
  <title>招标管理 · 亿有引力</title>
  <link rel="icon" href="/mgmt/bids/assets/brand-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/mgmt/bids/styles.css">
  <script src="/mgmt/bids/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="/mgmt/bids" aria-label="亿有引力招标管理"><img class="brand-mark" src="/mgmt/bids/assets/brand-mark.svg" width="42" height="42" alt=""><span>亿有引力<small>企业管理</small></span></a>
      <div class="workspace-label">采购与业务</div>
      <nav id="navigation">
        <button class="nav-item active" data-view="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="nav-label">项目台账</span></button>
        <button class="nav-item" data-view="expired"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8M8 21h8M9 3v4l6 10v4M15 3v4L9 17v4"/><path d="M8 11h8"/></svg><span class="nav-label">已过期</span><span class="nav-count" id="expired-count">0</span></button>
        <button class="nav-item" data-view="discarded"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="6" width="16" height="15" rx="2"/><path d="M8 6V3h8v3M9 11l6 6M15 11l-6 6"/></svg><span class="nav-label">已弃标</span><span class="nav-count" id="discarded-count">0</span></button>
        <button class="nav-item" data-view="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18M8 15h2M14 15h2"/></svg><span class="nav-label">截止日历</span></button>
        <button class="nav-item" data-view="cas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 8 3v6c0 4.5-4.5 7.5-8 9-3.5-1.5-8-4.5-8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg><span class="nav-label">CA 证书</span></button>
        <button class="nav-item" data-view="discover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5M8 10.5h5M10.5 8v5"/></svg><span class="nav-label">发现新项目</span></button>
        <button class="nav-item" data-view="activity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11M9 12h11M9 19h11"/><circle cx="4" cy="5" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="19" r="1"/></svg><span class="nav-label">操作记录</span></button>
      </nav>
      <div class="sidebar-bottom"><span class="company-dot"></span>北京亿有引力科技有限责任公司<a href="https://www.yiyouyinli.com" target="_blank" rel="noopener">访问官网 ↗</a></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb">企业管理<span>/</span><strong>招标管理</strong></div><div class="topbar-right"><span class="timezone">北京时间</span><span class="user-avatar" aria-hidden="true">陈</span><span id="current-user">管理员</span></div></header>
      <main id="main" tabindex="-1"><div class="loading-state"><span class="spinner"></span><p>正在读取项目台账…</p></div></main>
    </div>
  </div>
  <div id="drawer-root"></div>
  <dialog id="editor-dialog" aria-labelledby="editor-title"></dialog>
  <dialog id="project-action-dialog" aria-labelledby="project-action-title" aria-describedby="project-action-description"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
